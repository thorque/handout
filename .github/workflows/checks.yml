name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only: this workflow checks a change, it never writes one.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # The database suites need a real Postgres. Without one they skip themselves and
      # the run stays green — a light that cannot turn red. The image is the one the
      # operating stack uses. This database dies with the runner, so its credentials
      # belong here and not in a secret: a secret is for a value that also means
      # something outside the run.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: handout
          POSTGRES_PASSWORD: handout
          POSTGRES_DB: handout_test
        # Published, because the job runs on the runner itself, not inside a container
        # on the service network.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U handout -d handout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 127.0.0.1 and not localhost: the published port is bound on IPv4, and localhost
      # can resolve to ::1 first. The tests create a schema of their own in this
      # database, so an empty one is all it has to be.
      HANDOUT_TEST_DATABASE_URL: postgresql://handout:handout@127.0.0.1:5432/handout_test
      # The runner sets this itself. Restated here because the test support reads it to
      # decide that a missing database is a failure rather than a skip — so the
      # dependency is visible in the file that relies on it.
      CI: true
      # IPv4 literal, same reason as the database URL above. No Caddy in front here, so
      # issuer and reachable origin are the same address and the workbench shim's other
      # half (HANDOUT_OIDC_INTERNAL_ORIGIN / KEYCLOAK_URL) stays unset on purpose.
      HANDOUT_TEST_OIDC_ISSUER_URL: http://127.0.0.1:8080/realms/handout

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Deviation from the postgres service container above: a service container's mount
      # is only available once it starts, and it starts before `actions/checkout` runs —
      # so it cannot mount this repository's realm file. A plain `docker run` after
      # checkout can. The dev realm's secret and its test users' password mean nothing
      # outside a throwaway container, so they belong in this file rather than a secret,
      # exactly the argument already made for the postgres credentials above.
      - name: Start Keycloak for the OIDC suites
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 \
            -v "$PWD/keycloak/realm.json:/opt/keycloak/data/import/handout.json:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.6 \
            start-dev --import-realm

          # Not /health/ready (management port 9000, not published above): that would
          # only prove the server answers, not that the realm import — what the OIDC
          # suites actually depend on — has finished. The realm's own discovery document
          # 404s until the import is done and 200s once it is, so it is the better probe
          # for this job.
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/realms/handout/.well-known/openid-configuration \
              >/dev/null 2>&1; then
              echo "Keycloak is ready, realm imported."
              exit 0
            fi
            sleep 2
          done

          echo "Keycloak did not become ready in time." >&2
          docker logs keycloak
          exit 1

      # One step, and the list of checks lives in package.json rather than here:
      # `verify` is defined as this plus `smoke`, so a check added later cannot reach
      # the human gate and miss the pipeline. `smoke` is not here — it needs the
      # service, Vite and Caddy up at once.
      - run: npm run check

  signoff:
    # Only a pull request has a commit range of its own. On a push to main there is
    # nothing to check, and the history from before this rule carries no sign-off.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow clone has neither the base commit nor the branch's own
          # commits, and the range below needs both.
          fetch-depth: 0
      - name: Check the sign-off trailers of this pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-signoff.sh "$BASE_SHA" "$HEAD_SHA"
