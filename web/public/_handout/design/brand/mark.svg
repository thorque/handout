<!-- The mark on its own, authored from the design's 24 px cell: a 24-wide frame spanning
     0…24 and an accent square spanning 19…29, i.e. half of it past the bottom-right
     corner. Scales to any size. The frame follows currentColor; the accent is a literal,
     because an SVG referenced by <img> sees none of the host page's custom properties. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" width="29" height="29" role="img" aria-labelledby="handout-mark-title">
  <title id="handout-mark-title">handout</title>
  <rect x="1" y="1" width="22" height="22" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
  <rect x="19" y="19" width="10" height="10" fill="#b23a16" />
</svg>
